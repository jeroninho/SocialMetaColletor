kind = "web"
previewPath = "/"
title = "SocialMetaCollector"
version = "1.0.0"
id = "artifacts/social-meta-collector"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24982

[services.development]
run = "pnpm --filter @workspace/social-meta-collector run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/social-meta-collector", "run", "build" ]
publicDir = "artifacts/social-meta-collector/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24982"
BASE_PATH = "/"
