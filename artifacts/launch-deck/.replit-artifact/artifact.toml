kind = "slides"
previewPath = "/launch-deck/"
title = "SocialMetaCollector Launch Deck"
version = "1.0.0"
id = "artifacts/launch-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/launch-deck/" ]
localPort = 21317

[services.development]
run = "pnpm --filter @workspace/launch-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/launch-deck", "run", "build" ]
publicDir = "artifacts/launch-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21317"
BASE_PATH = "/launch-deck/"
